# --- MEMORY & JVM ---
# Allocates 4GB of RAM to Gradle and enables native access (suppresses JVM warnings on Gradle 9.x)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# --- GRADLE PERFORMANCE & CACHING ---
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.x
org.gradle.tooling.parallel=true

# --- ANDROIDX & KOTLIN ---
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- OPTIMIZATIONS & AGP RECOMMENDATIONS ---
# Suppresses the performance warning during project import
android.dependency.excludeLibraryComponentsFromConstraints=true
