# --- MEMORY & JVM ---
# Allocates 4GB of RAM to Gradle for faster build execution times (adjust to -Xmx2048m if your host system has 8GB RAM in total)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# --- GRADLE PERFORMANCE & CACHING ---
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# --- ANDROIDX & KOTLIN ---
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- OPTIMIZATIONS & AGP RECOMMENDATIONS ---
# Suppresses the performance warning during project import
android.dependency.excludeLibraryComponentsFromConstraints=true

# --- DEPRECATED / REMOVED (NO LONGER IN USE IN RECENT AGP VERSIONS) ---
# - android.defaults.buildfeatures.resvalues
# - android.sdk.defaultTargetSdkToCompileSdkIfUnset
# - android.enableAppCompileTimeRClass
# - android.usesSdkInManifest.disallowed
# - android.uniquePackageNames
# - android.dependency.useConstraints
# - android.r8.strictFullModeForKeepRules
# - android.r8.optimizedResourceShrinking
# - android.builtInKotlin
# - android.newDsl
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
